name: Apply official statistical patch

on:
  push:
    branches:
      - science/official-experiment-v1
    paths:
      - 'ops/apply_official_statistical_patch.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: science/official-experiment-v1
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply deterministic patch
        run: python ops/apply_official_statistical_patch.py
      - name: Verify patched sources
        run: |
          python -m py_compile \
            simulator/official_orientation.py \
            simulator/official_monte_carlo.py \
            simulator/official_provenance.py \
            scripts/run_official_experiment.py \
            tests/test_official_orientation.py
          python -m pip install -r requirements.txt
          PYTHONPATH=. pytest -q tests/test_official_experiment.py tests/test_official_orientation.py
      - name: Commit verified patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            simulator/official_provenance.py \
            scripts/run_official_experiment.py \
            config/official_experiment_v1.json \
            .github/workflows/official-pr-smoke.yml \
            .github/workflows/official-experiment-v1.yml \
            EXPERIMENT_DEPLOYMENT_OFFICIAL_V1.md
          git rm ops/apply_official_statistical_patch.py
          git rm .github/workflows/apply-official-statistical-patch.yml
          git commit -m 'science: strengthen smoke and orientation equivalence validation'
          git push origin HEAD:science/official-experiment-v1
