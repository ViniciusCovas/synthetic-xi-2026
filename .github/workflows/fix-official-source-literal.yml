name: Fix Official Source Literal

on:
  push:
    branches:
      - science/official-experiment-v1
    paths:
      - '.github/workflows/fix-official-source-literal.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correct Python boolean literal
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('simulator/official_monte_carlo.py')
          text = path.read_text(encoding='utf-8')
          old = '"common_random_numbers": true,'
          new = '"common_random_numbers": True,'
          if old not in text:
              raise SystemExit('Expected literal not found; refusing ambiguous patch')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add simulator/official_monte_carlo.py
          git commit -m 'fix: correct official orientation boolean literal'
          git push
