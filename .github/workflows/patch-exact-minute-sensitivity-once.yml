name: Patch Exact Minute Sensitivity Once

on:
  push:
    branches:
      - science/official-experiment-v1
    paths:
      - '.github/workflows/patch-exact-minute-sensitivity-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch official feature consumers and tests
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          profiles = Path('simulator/official_profiles.py')
          text = profiles.read_text(encoding='utf-8')
          text = text.replace(
              'from .profiles import _to_profile, load_feature_table\n',
              'from .official_features import load_official_feature_table\nfrom .profiles import _to_profile\n',
              1,
          )
          pattern = r'def _feature_frame\(minimum_minutes: int\) -> pd\.DataFrame:.*?(?=\n\ndef _trimmed_profile)'
          replacement = '''def _feature_frame(minimum_minutes: int) -> pd.DataFrame:\n    frame = resolve_exploratory_roles(\n        load_official_feature_table(minimum_minutes)\n    ).copy()\n    frame["player_id_key"] = frame["player_id"].astype(str)\n    frame["minutes_num"] = pd.to_numeric(\n        frame["minutes_num"], errors="coerce"\n    ).fillna(0.0)\n    if frame.empty:\n        raise RuntimeError("No players satisfy the official minimum-minutes rule")\n    return frame'''
          text, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'Could not patch _feature_frame: {count}')
          profiles.write_text(text, encoding='utf-8')

          sensitivity = Path('simulator/official_profile_sensitivity.py')
          text = sensitivity.read_text(encoding='utf-8')
          text = text.replace(
              'from .profiles import load_feature_table\n',
              'from .official_features import load_official_feature_table\n',
              1,
          )
          text = text.replace(
              'frame = load_feature_table().copy()',
              'frame = load_official_feature_table(minimum_minutes).copy()',
              1,
          )
          sensitivity.write_text(text, encoding='utf-8')

          provenance = Path('simulator/official_provenance.py')
          text = provenance.read_text(encoding='utf-8')
          marker = '"official_profiles_source": Path("simulator/official_profiles.py"),'
          insertion = '"official_features_source": Path("simulator/official_features.py"),\n        ' + marker
          if '"official_features_source"' not in text:
              if marker not in text:
                  raise SystemExit('Provenance marker missing')
              text = text.replace(marker, insertion, 1)
          provenance.write_text(text, encoding='utf-8')

          test = Path('tests/test_official_experiment.py')
          text = test.read_text(encoding='utf-8')
          import_marker = 'from simulator.official_monte_carlo import simulate_official_finals\n'
          if 'from simulator.official_features import load_official_feature_table' not in text:
              text = text.replace(
                  import_marker,
                  'from simulator.official_features import load_official_feature_table\n' + import_marker,
                  1,
              )
          test_marker = '\n\ndef test_top_n_uses_real_n_when_requested_n_exceeds_role_universe() -> None:'
          new_test = '''\n\ndef test_minimum_minutes_sensitivity_is_exact() -> None:\n    frame_180 = load_official_feature_table(180)\n    frame_450 = load_official_feature_table(450)\n    frame_900 = load_official_feature_table(900)\n    assert frame_180.minutes_num.min() >= 180\n    assert frame_450.minutes_num.min() >= 450\n    assert frame_900.minutes_num.min() >= 900\n    assert len(frame_180) >= len(frame_450) >= len(frame_900)\n    assert (frame_180.minutes_num < 450).any()\n\n\ndef test_top_n_uses_real_n_when_requested_n_exceeds_role_universe() -> None:'''
          if 'def test_minimum_minutes_sensitivity_is_exact' not in text:
              if test_marker not in text:
                  raise SystemExit('Test insertion marker missing')
              text = text.replace(test_marker, new_test, 1)
          test.write_text(text, encoding='utf-8')
          PY
      - name: Compile and commit exact-threshold correction
        run: |
          python -m py_compile \
            simulator/official_features.py \
            simulator/official_profiles.py \
            simulator/official_profile_sensitivity.py \
            simulator/official_provenance.py \
            tests/test_official_experiment.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            simulator/official_features.py \
            simulator/official_profiles.py \
            simulator/official_profile_sensitivity.py \
            simulator/official_provenance.py \
            tests/test_official_experiment.py
          git commit -m 'science: make 180 450 and 900 minute sensitivities exact'
          git push
