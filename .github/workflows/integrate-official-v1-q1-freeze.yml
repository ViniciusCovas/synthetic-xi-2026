name: Integrate official v1 Q1 freeze

on:
  push:
    branches:
      - main
    paths:
      - '.github/official-v1-q1-freeze-trigger/**'

permissions:
  contents: write

env:
  OFFICIAL_SHA: '0461ed7b5cf796cd4ab484eeca4ceb5a8075e41b'
  OFFICIAL_BRANCH: 'science/official-experiment-v1'
  REPLICATION_BRANCH: 'science/official-v1-precision-replication-50k'
  INTEGRATION_BRANCH: 'integration/official-v1-q1-freeze'
  PYTHONHASHSEED: '0'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch frozen scientific branches
        run: |
          set -euo pipefail
          git fetch origin "$OFFICIAL_BRANCH" "$REPLICATION_BRANCH"
          test "$(git rev-parse origin/$OFFICIAL_BRANCH)" = "$OFFICIAL_SHA"
          test "$(git show origin/$REPLICATION_BRANCH:data/model_readiness/official_v1_precision_replication_50000_completion.json | python -c 'import json,sys; print(json.load(sys.stdin)["status"])')" = "official_v1_precision_replication_50000_complete"

      - name: Create integration branch and merge official experiment
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B "$INTEGRATION_BRANCH" origin/main
          cp README.md /tmp/main-README.md

          set +e
          git merge --no-ff --no-commit "$OFFICIAL_SHA"
          merge_status=$?
          set -e

          conflicts="$(git diff --name-only --diff-filter=U || true)"
          unexpected="$(printf '%s\n' "$conflicts" | sed '/^$/d' | grep -Ev '^(README\.md|simulator/__init__\.py)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected merge conflicts:"
            echo "$unexpected"
            exit 1
          fi
          if [ "$merge_status" -ne 0 ] && [ -z "$conflicts" ]; then
            echo "Merge failed without resolvable conflicts"
            exit 1
          fi

          cp /tmp/main-README.md README.md
          cat >> README.md <<'EOF'

## Experimento oficial v1 — resultado congelado

A comparação confirmatória foi executada com o motor `complete_final_official_v1`, plantéis congelados, autorização fail-closed e ausência de ajuste pós-resultado.

- Corrida confirmatória principal: **10.000 finais**, seed `2026073001`.
- Synthetic XI campeão: **44,590%** (IC 95%: 43,618%–45,566%).
- Real Best XI campeão: **55,410%** (IC 95%: 54,434%–56,382%).
- Replicação independente de precisão: **50.000 finais**, seed `2026073102`.
- Synthetic XI campeão na replicação: **44,696%** (IC 95%: 44,261%–45,132%).
- Diferença entre as duas estimativas: **0,106 ponto percentual**; consistência de Monte Carlo aprovada.
- Síntese secundária de 60.000: Synthetic XI **44,678%** (IC 95%: 44,281%–45,076%).

A corrida de 10.000 permanece o resultado confirmatório primário; a corrida de 50.000 é reportada separadamente como replicação pré-registrada de precisão. Consulte `SCIENTIFIC_RELEASE_OFFICIAL_V1.md`, `METHODS_OFFICIAL_V1.md` e os manifests em `data/experiments/`.
EOF

          git show "$OFFICIAL_SHA":simulator/__init__.py > simulator/__init__.py
          git add -A
          git commit -m 'science: integrate official v1 confirmatory experiment'

      - name: Merge preregistered 50000-run replication
        run: |
          set -euo pipefail
          git merge --no-ff "origin/$REPLICATION_BRANCH" \
            -m 'science: integrate preregistered 50000-run precision replication'

      - name: Write scientific release record
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          base = json.loads(Path('data/experiments/official_v1/official/simulation_summary.json').read_text())
          rep = json.loads(Path('data/experiments/official_v1_precision_replication_50000/official/simulation_summary.json').read_text())
          comparison = json.loads(Path('data/model_readiness/official_v1_precision_replication_50000_comparison.json').read_text())
          completion = json.loads(Path('data/model_readiness/official_experiment_v1_completion.json').read_text())
          rep_completion = json.loads(Path('data/model_readiness/official_v1_precision_replication_50000_completion.json').read_text())

          lines = [
              '# Scientific Release — Official Experiment v1',
              '',
              '## Status',
              '',
              '- Confirmatory experiment: **complete**.',
              '- Independent precision replication: **complete**.',
              '- Post-result tuning: **not performed**.',
              '- Engine: `complete_final_official_v1`.',
              f'- Authorized source revision: `{completion["authorized_source_sha"]}`.',
              '',
              '## Primary confirmatory result',
              '',
              f'- Simulations: **{base["simulations"]:,}**.',
              f'- Master seed: `{base["master_seed"]}`.',
              f'- Synthetic XI champion probability: **{100*base["home_champion_probability"]["estimate"]:.3f}%**.',
              f'- 95% interval: **{100*base["home_champion_probability"]["low"]:.3f}%–{100*base["home_champion_probability"]["high"]:.3f}%**.',
              f'- Real Best XI champion probability: **{100*base["away_champion_probability"]["estimate"]:.3f}%**.',
              '',
              '## Independent precision replication',
              '',
              f'- Simulations: **{rep["simulations"]:,}**.',
              f'- Master seed: `{rep["master_seed"]}`.',
              f'- Synthetic XI champion probability: **{100*rep["home_champion_probability"]["estimate"]:.3f}%**.',
              f'- 95% interval: **{100*rep["home_champion_probability"]["low"]:.3f}%–{100*rep["home_champion_probability"]["high"]:.3f}%**.',
              f'- Difference from confirmatory estimate: **{100*comparison["comparison"]["absolute_difference"]:.3f} percentage points**.',
              f'- Monte Carlo consistency: **{str(comparison["comparison"]["monte_carlo_consistency_passed"]).upper()}**.',
              '',
              '## Secondary pooled precision summary',
              '',
              f'- Simulations: **{comparison["secondary_pooled_precision_summary"]["simulations"]:,}**.',
              f'- Synthetic XI champion probability: **{100*comparison["secondary_pooled_precision_summary"]["synthetic_champion_probability"]:.3f}%**.',
              f'- Wilson 95% interval: **{100*comparison["secondary_pooled_precision_summary"]["wilson_95_interval"]["low"]:.3f}%–{100*comparison["secondary_pooled_precision_summary"]["wilson_95_interval"]["high"]:.3f}%**.',
              '- Epistemic role: secondary only; it does not replace the 10,000-run confirmatory result.',
              '',
              '## Mandatory gates',
              '',
              '- Event sanity: PASS.',
              '- Discipline calibration: PASS.',
              '- Orientation equivalence: PASS.',
              '- Seed stability: PASS.',
              '- H5–H7 estimands present: PASS.',
              '- Source hashes equal between confirmatory and replication runs: PASS.',
              '- Precision target: PASS.',
              '- Directional replication: PASS.',
              '',
              '## Immutable evidence',
              '',
              f'- Confirmatory summary SHA-256: `{completion["summary_sha256"]}`.',
              f'- Confirmatory manifest SHA-256: `{completion["manifest_sha256"]}`.',
              f'- Replication summary SHA-256: `{rep_completion["summary_sha256"]}`.',
              f'- Replication manifest SHA-256: `{rep_completion["manifest_sha256"]}`.',
              f'- Comparison SHA-256: `{rep_completion["comparison_sha256"]}`.',
              '',
              '## Interpretation policy',
              '',
              'The model estimates outcomes under its frozen assumptions. It does not establish real-world causal truth or claim that a simulated team would physically defeat a real team. No parameters or code may be changed retroactively to improve the observed result.',
          ]
          Path('SCIENTIFIC_RELEASE_OFFICIAL_V1.md').write_text('\n'.join(lines) + '\n')
          PY
          git add SCIENTIFIC_RELEASE_OFFICIAL_V1.md README.md
          git commit -m 'docs: freeze official v1 scientific release record'

      - name: Remove one-shot operational scaffolding
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/patch-official-statistics-branch.yml \
            .github/workflows/run-official-v1-validation.yml \
            .github/workflows/run-official-v1-confirmatory.yml \
            .github/workflows/run-official-v1-precision-replication-50k.yml \
            .github/workflows/integrate-official-v1-q1-freeze.yml
          rm -rf \
            .github/patch-official-statistics-trigger \
            .github/official-v1-validation-trigger \
            .github/official-v1-confirmatory-trigger \
            .github/official-v1-precision-replication-50k-trigger \
            .github/official-v1-q1-freeze-trigger
          git add -A
          git commit -m 'ci: remove completed one-shot scientific workflows'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Validate integrated scientific freeze
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt
          python -m py_compile \
            simulator/official_complete_final.py \
            simulator/official_orientation.py \
            simulator/official_provenance.py \
            scripts/run_official_experiment.py \
            scripts/run_official_experiment_v1_1.py \
            scripts/scientific/analyze_official_hypotheses.py \
            scripts/scientific/validate_official_release.py
          PYTHONPATH=. pytest -q \
            tests/test_official_experiment.py \
            tests/test_official_orientation.py
          PYTHONPATH=. python scripts/scientific/validate_official_release.py \
            --mode structural \
            --status-output /tmp/integrated_official_v1_preflight.json
          python - <<'PY'
          import json
          from pathlib import Path
          official = json.loads(Path('data/model_readiness/official_experiment_v1_completion.json').read_text())
          replication = json.loads(Path('data/model_readiness/official_v1_precision_replication_50000_completion.json').read_text())
          comparison = json.loads(Path('data/model_readiness/official_v1_precision_replication_50000_comparison.json').read_text())
          assert official['status'] == 'official_experiment_v1_confirmatory_complete'
          assert official['simulations'] == 10000
          assert official['post_result_tuning_performed'] is False
          assert replication['status'] == 'official_v1_precision_replication_50000_complete'
          assert replication['simulations'] == 50000
          assert replication['precision_passed'] is True
          assert replication['monte_carlo_consistency_passed'] is True
          assert replication['source_hashes_equal_baseline'] is True
          assert replication['post_result_tuning_performed'] is False
          assert comparison['comparison']['direction_matches'] is True
          assert comparison['comparison']['monte_carlo_consistency_passed'] is True
          assert Path('SCIENTIFIC_RELEASE_OFFICIAL_V1.md').exists()
          print('integrated scientific freeze validated')
          PY

      - name: Push integration branch
        run: |
          set -euo pipefail
          git push --force-with-lease origin HEAD:"$INTEGRATION_BRANCH"
