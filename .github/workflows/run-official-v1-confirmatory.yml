name: Run official v1 confirmatory experiment

on:
  push:
    branches:
      - main
    paths:
      - '.github/official-v1-confirmatory-trigger/**'

permissions:
  contents: write

env:
  PYTHONHASHSEED: '0'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  OFFICIAL_AUTHORIZED_SHA: '06c750cfef3246d3c6112f6bd86d25a83287308f'

jobs:
  confirmatory:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    concurrency:
      group: official-v1-confirmatory-frozen
      cancel-in-progress: false
    steps:
      - name: Checkout exact authorized science revision
        uses: actions/checkout@v4
        with:
          ref: ${{ env.OFFICIAL_AUTHORIZED_SHA }}
          fetch-depth: 1

      - name: Verify exact checkout and unchanged science branch
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$OFFICIAL_AUTHORIZED_SHA"
          git fetch origin science/official-experiment-v1
          test "$(git rev-parse FETCH_HEAD)" = "$OFFICIAL_AUTHORIZED_SHA"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install frozen dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile and test authorized source
        run: |
          python -m py_compile \
            simulator/official_orientation.py \
            simulator/official_provenance.py \
            scripts/run_official_experiment.py \
            scripts/run_official_experiment_v1_1.py \
            scripts/scientific/analyze_official_hypotheses.py \
            scripts/scientific/validate_official_release.py \
            tests/test_official_experiment.py \
            tests/test_official_orientation.py
          PYTHONPATH=. pytest -q \
            tests/test_official_experiment.py \
            tests/test_official_orientation.py

      - name: Reconfirm structural and release authorization gates
        run: |
          PYTHONPATH=. python scripts/scientific/validate_official_release.py \
            --mode structural \
            --status-output /tmp/official_structural_preflight.json
          python - <<'PY'
          import json
          from pathlib import Path
          authorization = json.loads(
              Path('data/model_readiness/official_release_authorization_v1.json').read_text()
          )
          assert authorization['official_release_authorized'] is True
          assert authorization['passed'] is True
          assert authorization['blocking_checks'] == []
          assert authorization['missing_or_failed_mandatory_gates'] == []
          print('release authorization reaffirmed')
          PY

      - name: Run frozen 10000-final confirmatory experiment
        run: |
          PYTHONPATH=. python scripts/run_official_experiment_v1_1.py \
            --mode official \
            --simulations 10000 \
            --output data/experiments/official_v1

      - name: Assert confirmatory package integrity
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          output = Path('data/experiments/official_v1/official')
          summary_path = output / 'simulation_summary.json'
          manifest_path = output / 'manifest.json'
          summary = json.loads(summary_path.read_text())
          manifest = json.loads(manifest_path.read_text())

          assert summary['mode'] == 'official'
          assert summary['simulations'] == 10000
          assert summary['version'] == 'complete_final_official_v1'
          assert summary['official_release_authorization_used']['official_release_authorized'] is True
          assert summary['event_sanity_gate']['passed'] is True
          assert summary['discipline_calibration_gate']['passed'] is True
          assert summary['orientation_equivalence']['passed'] is True
          assert summary['seed_stability']['passed'] is True
          assert manifest['mode'] == 'official'
          assert manifest['simulations'] == 10000
          assert manifest['source_hashes'] == summary['source_hashes']

          def sha256(path: Path) -> str:
              digest = hashlib.sha256()
              with path.open('rb') as handle:
                  for block in iter(lambda: handle.read(1024 * 1024), b''):
                      digest.update(block)
              return digest.hexdigest()

          completion = {
              'status': 'official_experiment_v1_confirmatory_complete',
              'engine_version': summary['version'],
              'authorized_source_sha': '${{ env.OFFICIAL_AUTHORIZED_SHA }}',
              'simulations': summary['simulations'],
              'master_seed': summary['master_seed'],
              'match_seed_ledger_sha256': summary['match_seed_ledger_sha256'],
              'summary_sha256': sha256(summary_path),
              'manifest_sha256': sha256(manifest_path),
              'release_authorization_used': True,
              'event_sanity_passed': True,
              'discipline_calibration_passed': True,
              'orientation_equivalence_passed': True,
              'seed_stability_passed': True,
              'post_result_tuning_performed': False,
              'full_package_storage': 'GitHub Actions immutable artifact',
              'result_interpretation_policy': 'Confirmatory result; no parameter or code changes permitted after observation.'
          }
          Path('data/model_readiness/official_experiment_v1_completion.json').write_text(
              json.dumps(completion, ensure_ascii=False, indent=2) + '\n'
          )
          print(json.dumps(completion, indent=2))
          PY

      - name: Commit compact confirmatory evidence only on unchanged branch
        run: |
          set -euo pipefail
          git fetch origin science/official-experiment-v1
          test "$(git rev-parse FETCH_HEAD)" = "$OFFICIAL_AUTHORIZED_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            data/model_readiness/official_experiment_v1_completion.json \
            data/experiments/official_v1/official/simulation_summary.json \
            data/experiments/official_v1/official/manifest.json \
            data/experiments/official_v1/official/official_hypotheses_summary.json \
            data/experiments/official_v1/official/official_h7_state_rates.csv \
            data/experiments/official_v1/official/official_h7_interactions.csv \
            data/experiments/official_v1/official/representative_final_timeline.csv \
            data/experiments/official_v1/official/synthetic_starting_xi.csv \
            data/experiments/official_v1/official/real_starting_xi.csv
          git commit -m 'results: publish official v1 confirmatory evidence'
          git push origin HEAD:science/official-experiment-v1

      - name: Upload immutable full confirmatory package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-v1-confirmatory-${{ github.run_id }}
          path: |
            /tmp/official_structural_preflight.json
            data/experiments/official_v1/official
            data/model_readiness/official_release_authorization_v1.json
            data/model_readiness/official_experiment_v1_completion.json
          if-no-files-found: warn
          retention-days: 90
