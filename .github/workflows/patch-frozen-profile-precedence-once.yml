name: Patch Frozen Profile Precedence Once

on:
  push:
    branches:
      - science/official-experiment-v1
    paths:
      - '.github/workflows/patch-frozen-profile-precedence-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch runtime and literal gate
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          profiles = Path('simulator/official_profiles.py')
          text = profiles.read_text(encoding='utf-8')
          pattern = r'def _real_profile\(entry: dict\[str, Any\], engine_role: str, frame_by_id: dict\[str, pd\.Series\]\) -> PlayerProfile:.*?(?=\n\ndef _compatible_engine_roles)'
          replacement = '''def _real_profile(entry: dict[str, Any], engine_role: str, frame_by_id: dict[str, pd.Series]) -> PlayerProfile:
    key = str(entry["player_id"])
    if key not in frame_by_id:
        raise RuntimeError(
            f"Frozen real player {key} ({entry.get('name')}) is absent from the official eligible feature frame"
        )
    profile = _to_profile(frame_by_id[key], engine_role)
    frozen_overrides = {
        metric: float(entry[metric])
        for metric in (
            "overall",
            "uncertainty",
            "finishing",
            "creation",
            "goalkeeping",
        )
        if metric in entry and entry[metric] is not None
    }
    return replace(
        profile,
        player_id=key,
        name=str(entry.get("name") or profile.name),
        role=engine_role,
        synthetic=False,
        **frozen_overrides,
    )'''
          text, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'Could not patch _real_profile: {count}')
          profiles.write_text(text, encoding='utf-8')

          validator = Path('scripts/scientific/validate_official_release.py')
          text = validator.read_text(encoding='utf-8')
          helper_marker = '\n\ndef _canonical_structural_checks(config: dict[str, Any]) -> tuple[dict[str, bool], dict[str, Any]]:'
          helper = '''\n\ndef _frozen_profile_mismatches(real: Any, frozen_team: dict[str, Any]) -> list[dict[str, Any]]:
    runtime = {player.player_id: player for player in real.team.players}
    for profiles in real.bench_by_role.values():
        for player in profiles:
            runtime.setdefault(player.player_id, player)
    mismatches: list[dict[str, Any]] = []
    for entry in list(frozen_team.get("starters", [])) + list(frozen_team.get("bench", [])):
        player_id = str(entry["player_id"])
        profile = runtime.get(player_id)
        if profile is None:
            mismatches.append({"player_id": player_id, "metric": "profile", "reason": "missing"})
            continue
        for metric in ("overall", "uncertainty", "finishing", "creation", "goalkeeping"):
            if metric not in entry or entry[metric] is None:
                continue
            runtime_value = float(getattr(profile, metric))
            frozen_value = float(entry[metric])
            if abs(runtime_value - frozen_value) > 1e-12:
                mismatches.append(
                    {
                        "player_id": player_id,
                        "metric": metric,
                        "runtime": runtime_value,
                        "frozen": frozen_value,
                    }
                )
    return mismatches


def _canonical_structural_checks(config: dict[str, Any]) -> tuple[dict[str, bool], dict[str, Any]]:'''
          if 'def _frozen_profile_mismatches' not in text:
              if helper_marker not in text:
                  raise SystemExit('Validator helper marker missing')
              text = text.replace(helper_marker, helper, 1)
          checks_marker = '    checks = {\n        "canonical_rosters_match_runtime": runtime_ids == frozen_ids,'
          checks_replacement = '    profile_mismatches = _frozen_profile_mismatches(\n        real, rosters["teams"]["real_best_xi"]\n    )\n    checks = {\n        "canonical_rosters_match_runtime": runtime_ids == frozen_ids,\n        "canonical_frozen_profile_values_match_runtime": not profile_mismatches,'
          if '"canonical_frozen_profile_values_match_runtime"' not in text:
              if checks_marker not in text:
                  raise SystemExit('Validator checks marker missing')
              text = text.replace(checks_marker, checks_replacement, 1)
          evidence_marker = '        "real_registered_ids": sorted(runtime_ids["real"]),\n'
          if '"frozen_profile_mismatches"' not in text:
              if evidence_marker not in text:
                  raise SystemExit('Validator evidence marker missing')
              text = text.replace(
                  evidence_marker,
                  evidence_marker + '        "frozen_profile_mismatches": profile_mismatches,\n',
                  1,
              )
          validator.write_text(text, encoding='utf-8')

          config_path = Path('config/official_experiment_v1.json')
          config = json.loads(config_path.read_text(encoding='utf-8'))
          gates = config['mandatory_release_gates']
          gate = 'canonical_frozen_profile_values_match_runtime'
          if gate not in gates:
              gates.insert(gates.index('no_provisional_profiles'), gate)
          config_path.write_text(json.dumps(config, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          protocol = Path('PROTOCOL_AMENDMENT_OFFICIAL_V1.md')
          text = protocol.read_text(encoding='utf-8')
          bullet = '- `canonical_frozen_profile_values_match_runtime = true`\n'
          marker = '- `canonical_rosters_match_runtime = true`\n'
          if bullet not in text:
              if marker not in text:
                  raise SystemExit('Protocol gate marker missing')
              text = text.replace(marker, marker + bullet, 1)
          protocol.write_text(text, encoding='utf-8')
          PY
      - name: Compile and commit correction
        run: |
          python -m py_compile \
            simulator/official_profiles.py \
            scripts/scientific/validate_official_release.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            simulator/official_profiles.py \
            scripts/scientific/validate_official_release.py \
            config/official_experiment_v1.json \
            PROTOCOL_AMENDMENT_OFFICIAL_V1.md
          git commit -m 'science: enforce frozen profile values at runtime'
          git push
