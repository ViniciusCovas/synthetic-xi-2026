name: Patch Official Provenance Once

on:
  push:
    branches:
      - science/official-experiment-v1
    paths:
      - '.github/workflows/patch-official-provenance-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire shared critical source hashes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          files = [
              (
                  Path('scripts/run_official_experiment.py'),
                  'from simulator.official_profiles import (',
                  'from simulator.official_provenance import critical_source_hashes\nfrom simulator.official_profiles import (',
                  r'def _source_hashes\(config: dict\[str, Any\]\) -> dict\[str, str \| None\]:.*?(?=\n\ndef _require_authorization)',
              ),
              (
                  Path('scripts/scientific/validate_official_release.py'),
                  'from simulator.official_profiles import CONFIG_PATH, ROSTER_PATH, build_official_bundles, team_rows',
                  'from simulator.official_profiles import CONFIG_PATH, ROSTER_PATH, build_official_bundles, team_rows\nfrom simulator.official_provenance import critical_source_hashes',
                  r'def _source_hashes\(config: dict\[str, Any\]\) -> dict\[str, str \| None\]:.*?(?=\n\ndef _canonical_structural_checks)',
              ),
          ]
          for path, marker, replacement, pattern in files:
              text = path.read_text(encoding='utf-8')
              if 'from simulator.official_provenance import critical_source_hashes' not in text:
                  if marker not in text:
                      raise SystemExit(f'Import marker missing in {path}')
                  text = text.replace(marker, replacement, 1)
              text, count = re.subn(
                  pattern,
                  'def _source_hashes(config: dict[str, Any]) -> dict[str, str | None]:\n    return critical_source_hashes(config)',
                  text,
                  count=1,
                  flags=re.S,
              )
              if count != 1:
                  raise SystemExit(f'Expected one _source_hashes function in {path}, got {count}')
              path.write_text(text, encoding='utf-8')
          PY
      - name: Verify and commit
        run: |
          python -m py_compile \
            simulator/official_provenance.py \
            scripts/run_official_experiment.py \
            scripts/scientific/validate_official_release.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add simulator/official_provenance.py scripts/run_official_experiment.py scripts/scientific/validate_official_release.py
          git commit -m 'science: freeze complete official provenance contract'
          git push
