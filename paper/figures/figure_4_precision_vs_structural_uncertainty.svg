<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="590" viewBox="0 0 1000 590">
<rect width="100%" height="100%" fill="white"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:currentColor}.title{font-size:26px;font-weight:700}.sub{font-size:15px}.lab{font-size:17px}.tick{font-size:14px}.val{font-size:15px;font-weight:700}</style>
<text x="40" y="45" class="title">Computational precision is not structural certainty</text><text x="40" y="72" class="sub">Synthetic XI champion probability under match randomness versus nested model and parameter uncertainty</text>
<line x1="300" y1="475" x2="920" y2="475" stroke="currentColor" stroke-width="2"/><line x1="300" y1="469" x2="300" y2="481" stroke="currentColor"/><text x="300" y="502" class="tick" text-anchor="middle">20%</text><line x1="424" y1="469" x2="424" y2="481" stroke="currentColor"/><text x="424" y="502" class="tick" text-anchor="middle">30%</text><line x1="548" y1="469" x2="548" y2="481" stroke="currentColor"/><text x="548" y="502" class="tick" text-anchor="middle">40%</text><line x1="672" y1="469" x2="672" y2="481" stroke="currentColor"/><text x="672" y="502" class="tick" text-anchor="middle">50%</text><line x1="796" y1="469" x2="796" y2="481" stroke="currentColor"/><text x="796" y="502" class="tick" text-anchor="middle">60%</text><line x1="920" y1="469" x2="920" y2="481" stroke="currentColor"/><text x="920" y="502" class="tick" text-anchor="middle">70%</text><line x1="672" y1="105" x2="672" y2="475" stroke="currentColor" stroke-dasharray="5,5"/>
<text x="40" y="161" class="lab">Confirmatory Monte Carlo</text><line x1="592.9" y1="155" x2="617.0" y2="155" stroke="currentColor" stroke-width="6" stroke-linecap="round"/><circle cx="604.9" cy="155" r="9" fill="currentColor"/><text x="935" y="161" class="val">44.6%</text>
<text x="40" y="276" class="lab">Precision replication</text><line x1="600.8" y1="270" x2="611.6" y2="270" stroke="currentColor" stroke-width="6" stroke-linecap="round"/><circle cx="606.2" cy="270" r="9" fill="currentColor"/><text x="935" y="276" class="val">44.7%</text>
<text x="40" y="391" class="lab">Nested model uncertainty</text><line x1="398.9" y1="385" x2="845.9" y2="385" stroke="currentColor" stroke-width="14" stroke-linecap="round" opacity="0.35"/><circle cx="610" cy="385" r="9" fill="currentColor"/><text x="935" y="391" class="val">45.0%</text>
<text x="40" y="555" class="sub">The nested interval is the 2.5th–97.5th percentile across 160 parameter worlds, not a conventional sampling CI.</text>
</svg>