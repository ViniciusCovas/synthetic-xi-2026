<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650">
<rect width="100%" height="100%" fill="white"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:currentColor}.title{font-size:26px;font-weight:700}.sub{font-size:15px}.lab{font-size:17px}.tick{font-size:13px}.val{font-size:15px;font-weight:700}</style>
<text x="40" y="45" class="title">H6: Real Best XI produces more extreme impact outcomes</text><text x="40" y="72" class="sub">Probability differences are Synthetic XI minus Real Best XI; negative values support H6</text>
<line x1="315" y1="545" x2="880" y2="545" stroke="currentColor" stroke-width="2"/><line x1="315" y1="539" x2="315" y2="551" stroke="currentColor"/><text x="315" y="572" class="tick" text-anchor="middle">-15 p.p.</text><line x1="481.2" y1="539" x2="481.2" y2="551" stroke="currentColor"/><text x="481.2" y="572" class="tick" text-anchor="middle">-10 p.p.</text><line x1="647.4" y1="539" x2="647.4" y2="551" stroke="currentColor"/><text x="647.4" y="572" class="tick" text-anchor="middle">-5 p.p.</text><line x1="813.5" y1="539" x2="813.5" y2="551" stroke="currentColor"/><text x="813.5" y="572" class="tick" text-anchor="middle">0 p.p.</text><line x1="813.5" y1="105" x2="813.5" y2="545" stroke="currentColor" stroke-dasharray="5,5"/>
<text x="40" y="156" class="lab">3+ goals</text><line x1="600.3" y1="150" x2="633.8" y2="150" stroke="currentColor" stroke-width="5" stroke-linecap="round"/><circle cx="617.2" cy="150" r="9" fill="currentColor"/><text x="900" y="156" class="val">-5.91 p.p.</text>
<text x="40" y="256" class="lab">xG above threshold</text><line x1="379.9" y1="250" x2="414.0" y2="250" stroke="currentColor" stroke-width="5" stroke-linecap="round"/><circle cx="396.8" cy="250" r="9" fill="currentColor"/><text x="900" y="256" class="val">-12.54 p.p.</text>
<text x="40" y="356" class="lab">Shots above threshold</text><line x1="690.4" y1="350" x2="712.7" y2="350" stroke="currentColor" stroke-width="5" stroke-linecap="round"/><circle cx="701.3" cy="350" r="9" fill="currentColor"/><text x="900" y="356" class="val">-3.38 p.p.</text>
<text x="40" y="456" class="lab">Win by margin</text><line x1="553.0" y1="450" x2="588.7" y2="450" stroke="currentColor" stroke-width="5" stroke-linecap="round"/><circle cx="571.2" cy="450" r="9" fill="currentColor"/><text x="900" y="456" class="val">-7.29 p.p.</text>
<text x="40" y="620" class="sub">Replication estimates from 50,000 finals; all four bootstrap intervals exclude zero.</text>
</svg>