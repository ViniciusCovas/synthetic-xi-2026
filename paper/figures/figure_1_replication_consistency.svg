<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="580" viewBox="0 0 1000 580">
<rect width="100%" height="100%" fill="white"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:currentColor}.title{font-size:26px;font-weight:700}.sub{font-size:15px}.lab{font-size:17px}.tick{font-size:14px}.val{font-size:15px;font-weight:700}</style>
<text x="40" y="45" class="title">Synthetic XI champion probability</text>
<text x="40" y="72" class="sub">Confirmatory estimate, independent precision replication, and secondary pooled summary</text>
<line x1="310" y1="490" x2="920" y2="490" stroke="currentColor" stroke-width="2"/>
<line x1="310.0" y1="484" x2="310.0" y2="496" stroke="currentColor"/><text x="310.0" y="518" class="tick" text-anchor="middle">42%</text>
<line x1="432.0" y1="484" x2="432.0" y2="496" stroke="currentColor"/><text x="432.0" y="518" class="tick" text-anchor="middle">43%</text>
<line x1="554.0" y1="484" x2="554.0" y2="496" stroke="currentColor"/><text x="554.0" y="518" class="tick" text-anchor="middle">44%</text>
<line x1="676.0" y1="484" x2="676.0" y2="496" stroke="currentColor"/><text x="676.0" y="518" class="tick" text-anchor="middle">45%</text>
<line x1="798.0" y1="484" x2="798.0" y2="496" stroke="currentColor"/><text x="798.0" y="518" class="tick" text-anchor="middle">46%</text>
<line x1="920.0" y1="484" x2="920.0" y2="496" stroke="currentColor"/><text x="920.0" y="518" class="tick" text-anchor="middle">47%</text>
