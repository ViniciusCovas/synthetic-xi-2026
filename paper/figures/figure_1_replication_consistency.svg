<text x="40" y="276" class="lab">Precision replication (50,000)</text>
<line x1="585.8" y1="270" x2="692.1" y2="270" stroke="currentColor" stroke-width="5" stroke-linecap="round"/><line x1="585.8" y1="259" x2="585.8" y2="281" stroke="currentColor" stroke-width="2"/><line x1="692.1" y1="259" x2="692.1" y2="281" stroke="currentColor" stroke-width="2"/><circle cx="638.9" cy="270" r="9" fill="currentColor"/><text x="940" y="276" class="val">44.696%</text>
<text x="40" y="391" class="lab">Secondary pooled (60,000)</text>
